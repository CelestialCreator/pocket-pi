[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-learner-dspy"
version = "0.1.0"
description = "DSPy/GEPA reflection backend for pi-skill-learner. Runs on NVIDIA NIM free tier."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Pocket Pi contributors" }]
dependencies = [
  "dspy-ai>=2.4",
  "openai>=1.40",
]

[project.scripts]
skill_learner_dspy = "skill_learner_dspy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
